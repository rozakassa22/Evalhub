[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalhub"
version = "0.1.0"
description = "A scalable FastAPI platform for evaluating LLM outputs, with an LLM-as-judge workflow and a streaming batch-processing tool."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "evalhub contributors" }]
keywords = ["llm", "evaluation", "fastapi", "ai", "benchmarking"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
evalhub-process = "evalhub.processing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
# Note: pyupgrade (UP) is intentionally omitted. The codebase targets Python
# 3.9, where Pydantic and FastAPI evaluate annotations at runtime, so we keep
# `typing.Optional[...]` rather than the 3.10+ `X | None` syntax UP would force.

[tool.mypy]
python_version = "3.9"
packages = ["evalhub"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
